<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Engineering Hub Bot</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1120; --panel: #111a2b; --line: #25334b; --text: #edf3ff; --muted: #9aa9c1; --accent: #73e0c1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; background: radial-gradient(ellipse at top, #17253b, var(--bg) 60%); color: var(--text); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app { width: min(100%, 760px); height: min(860px, calc(100dvh - 36px)); min-height: 480px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: color-mix(in srgb, var(--panel) 95%, transparent); box-shadow: 0 24px 80px #0008; }
    header { display: flex; align-items: center; gap: 13px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .logo { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 auto; border-radius: 14px; background: #193c3b; color: var(--accent); font-size: 22px; }
    h1 { margin: 0; font-size: 1.05rem; letter-spacing: .01em; }
    .status { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
    .status::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--accent); }
    #messages { flex: 1; overflow-y: auto; padding: 24px 20px; scroll-behavior: smooth; }
    .welcome { max-width: 520px; margin: 12px auto 28px; text-align: center; }
    .welcome h2 { margin: 0 0 8px; font-size: clamp(1.35rem, 5vw, 1.8rem); }
    .welcome p { margin: 0; color: var(--muted); }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 19px; }
    .suggestion { padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; background: #141f32; color: var(--text); cursor: pointer; font: inherit; font-size: .88rem; }
    .suggestion:hover { border-color: var(--accent); }
    .message { width: fit-content; max-width: min(85%, 520px); margin: 12px 0; padding: 11px 15px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.bot { border: 1px solid var(--line); background: #172338; border-bottom-left-radius: 5px; }
    .message.user { margin-left: auto; background: #1b6257; border-bottom-right-radius: 5px; }
    form { display: flex; align-items: center; gap: 10px; padding: 14px; border-top: 1px solid var(--line); background: #0e1727; }
    input { min-width: 0; flex: 1; padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; outline: none; background: #111c2e; color: var(--text); font: inherit; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #73e0c122; }
    form button { display: grid; place-items: center; width: 48px; height: 48px; flex: 0 0 auto; border: 0; border-radius: 14px; background: var(--accent); color: #0a211d; cursor: pointer; font-size: 1.25rem; }
    form button:disabled { opacity: .5; cursor: default; }
    .hint { margin: 0; padding: 0 16px 12px; background: #0e1727; color: var(--muted); text-align: center; font-size: .75rem; }
    @media (max-width: 480px) { body { padding: 0; } .app { width: 100%; height: 100dvh; min-height: 420px; border: 0; border-radius: 0; } header { padding: 14px 16px; } #messages { padding: 18px 14px; } .welcome { margin-top: 24px; } }
  </style>
</head>
<body>
  <main class="app" aria-label="Aayush Engineering Hub chatbot">
    <header>
      <div class="logo" aria-hidden="true">⌘</div>
      <div><h1>Engineering Hub Bot</h1><p class="status">Ready to help</p></div>
    </header>
    <section id="messages" aria-live="polite" aria-label="Conversation">
      <div class="welcome" id="welcome">
        <h2>Welcome to Aayush Engineering Hub</h2>
        <p>Ask about DSA, system design, interview preparation, or the resources in this hub.</p>
        <div class="suggestions">
          <button class="suggestion" type="button">Help me prepare for interviews</button>
          <button class="suggestion" type="button">What is in the DSA sheet?</button>
          <button class="suggestion" type="button">Explain system design</button>
        </div>
      </div>
    </section>
    <form id="chat-form">
      <input id="question" name="question" autocomplete="off" placeholder="Ask the Engineering Hub…" aria-label="Your message" required>
      <button id="send" type="submit" aria-label="Send message">➤</button>
    </form>
    <p class="hint">Starter demo · Connect an AI service to enable generated answers</p>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#question');
    const messages = document.querySelector('#messages');
    const welcome = document.querySelector('#welcome');
    const send = document.querySelector('#send');

    function addMessage(text, role) {
      const message = document.createElement('div');
      message.className = `message ${role}`;
      message.textContent = text;
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
    }

    function demoReply(question) {
      const q = question.toLowerCase();
      if (q.includes('interview')) return 'Start with the Interview-Ready resources, then practice problems from the DSA and System Design sheet. Try to explain your approach out loud and review edge cases after each problem.';
      if (q.includes('dsa') || q.includes('sheet')) return 'The repository includes Aayush-DSA-System-Design-Sheet.csv. It is a structured list of DSA and system design topics you can use to plan your practice.';
      if (q.includes('system design')) return 'A good system design interview starts by clarifying requirements, estimating scale, and defining APIs. Then outline the architecture, data model, bottlenecks, and trade-offs.';
      return 'I’m a starter demo, so I can point you toward the hub but don’t have connected AI yet. Explore the AI and Interview-Ready folders, or connect this interface to your preferred assistant service.';
    }

    document.querySelectorAll('.suggestion').forEach(button => button.addEventListener('click', () => {
      input.value = button.textContent;
      form.requestSubmit();
    }));

    form.addEventListener('submit', event => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      welcome?.remove();
      addMessage(question, 'user');
      input.value = '';
      send.disabled = true;
      window.setTimeout(() => {
        addMessage(demoReply(question), 'bot');
        send.disabled = false;
        input.focus();
      }, 350);
    });
  </script>
</body>
</html>
